spring:
  application:
    name: backend
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/magister}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        hbm2ddl.halt_on_error: true

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:}
  timeout: ${GEMINI_TIMEOUT:30s}
  direct-endpoint-enabled: ${GEMINI_DIRECT_ENDPOINT_ENABLED:true}
  text-daily-limit: ${GEMINI_TEXT_DAILY_LIMIT:50}
  text-global-daily-limit: ${GEMINI_TEXT_GLOBAL_DAILY_LIMIT:500}

manuscript:
  import:
    max-concurrent-parses: ${MANUSCRIPT_MAX_CONCURRENT_PARSES:2}
    parse-timeout: ${MANUSCRIPT_PARSE_TIMEOUT:10s}

character-image:
  model: ${GEMINI_CHARACTER_IMAGE_MODEL:gemini-3.1-flash-image}
  daily-limit: ${CHARACTER_IMAGE_DAILY_LIMIT:3}

analysis:
  execution:
    threads: 2
    queue-capacity: 8
    max-active-jobs: 10
    lease-duration: 2m
    # 0은 자동 삭제 비활성. 활성화하면 완료 작업과 해당 멱등 키의 보존 기간이 된다.
    retention: ${ANALYSIS_JOB_RETENTION:0s}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

auth:
  rate-limit:
    window: 1m
    login-attempts: 20
    login-account-attempts: 20
    signup-attempts: 20
    email-checks: 60
    csrf-requests: 60
    concurrent-hashes: 4
    max-tracked-clients: 10000

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
  paths-to-match: /api/**

server:
  address: 127.0.0.1
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  tomcat:
    max-http-form-post-size: 8MB
    max-swallow-size: 8MB
    connection-timeout: 15s

  servlet:
    session:
      timeout: 1h
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

logging:
  level:
    # JDBC 오류 전문에는 중복 이메일 등 입력값이 포함될 수 있다. 애플리케이션은 코드·SQLState만 기록한다.
    org.hibernate.orm.jdbc.error: OFF
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}

gemini:
  direct-endpoint-enabled: ${GEMINI_DIRECT_ENDPOINT_ENABLED:false}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

server:
  servlet:
    session:
      cookie:
        secure: true

