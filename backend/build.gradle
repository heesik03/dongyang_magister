plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.magister'
version = '0.0.1-SNAPSHOT'
description = 'backend'

ext['tomcat.version'] = '11.0.27'
// 2026-11 보안 패치(CVE-2026-114938 / JDK-8393212: HotSpot Base64 AVX-512 디코더 힙 버퍼 오버플로우) 반영 기준 버전.
// 21.0.13.1 미만 로컬·CI 런타임에서도 취약한 어셈블리 경로를 타지 않도록 실행·테스트 JVM에 완화 옵션을 기본 적용한다.
ext['java.version'] = '21.0.13.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaExec).configureEach {
    jvmArgs '-XX:-UseBASE64Intrinsics'
}

tasks.withType(Test).configureEach {
    jvmArgs '-XX:-UseBASE64Intrinsics'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    implementation 'com.google.genai:google-genai:1.76.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    // 원고 Export/Import: 마크다운 AST 파싱(CommonMark), PDF 생성·추출(PDFBox), DOCX 생성·추출(Apache POI).
    // Java 21 호환 안정 버전을 고정하며 외부 런타임 의존 없이 서버 내부에서 문서를 변환한다.
    implementation 'org.commonmark:commonmark:0.24.0'
    implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.24.0'
    implementation 'org.apache.pdfbox:pdfbox:3.0.4'
    implementation 'org.apache.poi:poi-ooxml:5.4.0'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    exclude '**/MariaDbRefactoringTests.class'
    exclude '**/GeminiQualityEvaluationTests.class'
}

tasks.register('geminiTest', Test) {
    description = 'Evaluate bounded synthetic manuscripts with the configured real Gemini model'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    useJUnitPlatform()
    filter { includeTestsMatching 'com.magister.backend.verification.GeminiQualityEvaluationTests' }
    doFirst {
        if (providers.environmentVariable('MAGISTER_RUN_GEMINI_TESTS').getOrElse('') != 'true') {
            throw new GradleException('Set MAGISTER_RUN_GEMINI_TESTS=true to send only the synthetic evaluation fixtures to Gemini (maximum 10 calls)')
        }
    }
}

tasks.register('mariaDbTest', Test) {
    description = 'Run refactoring contracts against an isolated MariaDB schema'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    // 외부 DB의 현재 상태는 Gradle 입력 스냅샷으로 판단할 수 없다.
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    useJUnitPlatform()
    filter { includeTestsMatching 'com.magister.backend.verification.MariaDbRefactoringTests' }
    doFirst {
        String schema = providers.environmentVariable('MAGISTER_MARIADB_TEST_SCHEMA').getOrNull()
        if (schema == null) {
            schema = 'magister_refactor_' + UUID.randomUUID().toString().replace('-', '').substring(0, 12)
        }
        if (!(schema ==~ /magister_refactor_[a-f0-9]{12}/)) {
            throw new GradleException('Set MAGISTER_MARIADB_TEST_SCHEMA to an isolated magister_refactor_<12 hex> schema')
        }
        environment 'MAGISTER_MARIADB_TEST_SCHEMA', schema
    }
}
